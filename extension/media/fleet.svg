<!--
	Activity bar icon. VS Code renders activity bar icons at 24x24 and recolours
	them by CSS, so this is a single-path monochrome silhouette using
	`currentColor`: a multi-colour or hardcoded-fill icon would stay the wrong
	colour when the user switches between a light and a dark theme.
-->
